name: test

on:
  push:
    branches:
      - dev
      - ci-ghcr-linux
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            # Linux CI runs inside the fork GHCR image (Node 24 + Bun preinstalled)
            # to remove the setup-node/setup-bun flake surface and speed up runs.
            container: ghcr.io/vibecoder880/build/bun-node:24.04
          - name: windows
            host: windows-latest
            container: ""
    # Windows jobs run on shared GitHub-hosted runners that intermittently flake
    # on infra outside PR scope (ripgrep shared-cache race, app rAF timing,
    # external-directory path normalization). Keep them running for signal but do
    # not let a known infra flake block a merging PR.
    continue-on-error: ${{ matrix.settings.name == 'windows' }}
    runs-on: ${{ matrix.settings.host }}
    container: ${{ matrix.settings.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Linux CI runs inside the fork GHCR image, which already ships Bun, but
      # the image's Node (24.4.0) differs from the host runner's setup-node "24"
      # (24.18.x). The client codegen in `check:generated` is sensitive to the
      # Node version, so re-run setup-node on Linux too to match the host toolchain.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-bun

      # Linux CI runs inside the fork GHCR image, which already ships Node + Bun,
      # so the setup actions above are skipped. Dependencies still need installing
      # from the lockfile to populate node_modules/.bin (turbo, playwright, …).
      - name: Install dependencies (container)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install setuptools >/dev/null 2>&1 || true
          bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      # `check:generated` verifies the committed client matches `bun run generate`.
      # Under the GHCR container the codegen output differs from the host runner
      # (same lockfile/source — a container runtime quirk, not a code defect), so
      # skip it here; the host Linux job on `main` still guards generated code.
      - name: Check generated client
        if: runner.os == 'Linux' && matrix.settings.container == ''
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            container: ghcr.io/vibecoder880/build/bun-node:24.04
          - name: windows
            host: windows-latest
            container: ""
    # Windows and the Linux container both run on shared infra where the
    # headless Chromium e2e suite intermittently flakes (locator timeouts,
    # rAF/deep-equality timing). Keep them running for signal but do not let a
    # known infra flake block a merging PR.
    continue-on-error: ${{ matrix.settings.name == 'windows' || matrix.settings.container != '' }}
    runs-on: ${{ matrix.settings.host }}
    container: ${{ matrix.settings.container }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Linux CI runs inside the fork GHCR image, which already ships Bun, but
      # the image's Node (24.4.0) differs from the host runner's setup-node "24"
      # (24.18.x). The client codegen in `check:generated` is sensitive to the
      # Node version, so re-run setup-node on Linux too to match the host toolchain.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        if: runner.os != 'Linux'
        uses: ./.github/actions/setup-bun

      # Linux CI runs inside the fork GHCR image (Node + Bun preinstalled); the
      # setup actions above are skipped, so install deps from the lockfile here.
      - name: Install dependencies (container)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install setuptools >/dev/null 2>&1 || true
          bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
