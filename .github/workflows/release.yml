name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'vibecoder880/opencode'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Create draft release
        run: |
          gh release create ${{ github.ref_name }} \
            --repo vibecoder880/opencode \
            --draft \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: cd packages/opencode && bun run script/build.ts
        env:
          GH_REPO: vibecoder880/opencode
          OPENCODE_RELEASE: "true"
          OPENCODE_VERSION: ${{ github.ref_name }}

      - name: Publish release
        run: |
          gh release edit ${{ github.ref_name }} \
            --repo vibecoder880/opencode \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
